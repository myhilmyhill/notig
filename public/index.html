<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>notig</title>
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/toastui-editor.min.css" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/theme/toastui-editor-dark.min.css"
    media="(prefers-color-scheme: dark)" />
  <script type="importmap">
    {
      "imports": {
        "@toast-ui/editor": "https://esm.sh/@toast-ui/editor@3.2.2",
        "@isomorphic-git/lightning-fs": "https://esm.sh/@isomorphic-git/lightning-fs@4.6.2",
        "isomorphic-git": "https://esm.sh/isomorphic-git@1.36.1",
        "isomorphic-git/http/web": "https://esm.sh/isomorphic-git@1.36.1/http/web"
      }
    }
  </script>
  <script type="module" src="./app.js"></script>

</head>

<body>
  <header>
    <button id="mobile-back" title="Back" hidden>←</button>
    <h1>notig</h1>
    <div id="sync-status">offline</div>
    <button id="push-notes" title="Push">⬆️</button>
    <button id="pull-notes" title="Pull">⬇️</button>
    <button id="reset-notes" title="Reset">⏪</button>
  </header>
  <main>
    <aside id="sidebar">
      <section class="sidebar-section" id="notes-section">
        <div class="notes-toolbar">
          <div class="notes-toolbar-title">Notes</div>
          <div class="notes-toolbar-actions" id="notes-toolbar-actions">
            <select id="tag-filter" title="Filter by tag">
              <option value="">All tags</option>
            </select>
            <button id="new-note" title="New">➕</button>
          </div>
        </div>
        <ul id="note-list"></ul>
      </section>
    </aside>
    <section id="editor">
      <div class="history-bar">
        <select id="history-select" title="History">
          <option value="">現在</option>
        </select>
        <button id="delete" title="Delete">🚮</button>
      </div>
      <div id="editor-host" aria-label="Markdown editor"></div>
    </section>
  </main>
  <section id="empty-state">
    <button id="empty-clone" type="button">Clone</button>
  </section>
</body>

</html>
